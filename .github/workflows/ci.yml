# Every pull request, and every push to the main branches:
#   install → lint → typecheck → test (against a postgres:17 service) → check:messages → build
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Same image as tests/support/docker-compose.yml: Debian, en_US.UTF-8,
      # so text sorts the way Supabase sorts it.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shd_career_test
          LANG: en_US.utf8
          POSTGRES_INITDB_ARGS: --locale=en_US.UTF-8 --encoding=UTF8
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d shd_career_test"
          --health-interval 2s --health-timeout 3s --health-retries 30

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/shd_career_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:messages
      - name: Build
        run: npm run build
        env:
          # The build never connects; the env module only needs a well-formed value.
          DATABASE_URL: postgres://build:build@127.0.0.1:5432/build
