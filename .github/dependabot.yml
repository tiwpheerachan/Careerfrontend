# One grouped pull request a month each. Major versions are a decision, not an update.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      npm:
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # Pinned on purpose, see docs/setup.md (pinned versions). Security updates still come.
      - dependency-name: postcss
        update-types: ['version-update:semver-minor', 'version-update:semver-patch']
      - dependency-name: tailwindcss
        update-types: ['version-update:semver-minor', 'version-update:semver-patch']
      - dependency-name: '@tailwindcss/postcss'
        update-types: ['version-update:semver-minor', 'version-update:semver-patch']
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
