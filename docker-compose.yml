# Local Postgres for DEVELOPMENT — the database `npm run dev` uses.
#
#   npm run db:dev:up        start it (data is kept in a named volume)
#   npm run db:dev:migrate   bring the schema up to date
#   npm run db:dev:down      stop it; the data stays
#
# Three databases, never mixed up:
#
#   development   this file           127.0.0.1:55434   kept between runs
#   test          tests/support/...   127.0.0.1:55435   wiped every run
#   production    Supabase            .env.local        only through db:prod:*
#
# (shd_onelink uses 55433 / 55432, so both projects can run side by side.)
#
# postgres:17 on Debian, not Alpine, with the locale Supabase has: Alpine's
# musl has no locale collation, so text would sort differently here than in
# production.
#
# The password is for a database that only listens on this machine's
# loopback; it is a default, not a secret.
name: shd-career-dev

services:
  db:
    image: postgres:17
    container_name: shd-career-dev
    environment:
      POSTGRES_USER: ${DEV_DB_USER:-root}
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD:-dev_pass}
      POSTGRES_DB: ${DEV_DB_NAME:-shd_career_db_dev}
      LANG: en_US.utf8
      POSTGRES_INITDB_ARGS: '--locale=en_US.UTF-8 --encoding=UTF8'
    ports:
      # Loopback only: nobody else on the network reaches a dev database.
      - '127.0.0.1:${DEV_DB_PORT:-55434}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  pgdata:
    name: shd_career_dev_pgdata
